name: Bug report
description: Report a crash, incorrect behavior, or regression.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/joaomj/pi-claude-directsdk/issues) and check the [troubleshooting guide](https://github.com/joaomj/pi-claude-directsdk/blob/main/docs/troubleshooting.md) first.
        Do not share credentials, tokens, private prompts, or unredacted conversation traces.
        Report security vulnerabilities through [private reporting](https://github.com/joaomj/pi-claude-directsdk/security/advisories/new), not here.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What is broken? Include whether this started after an update.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest sequence that reproduces the problem, with exact commands where possible.
      placeholder: |
        1. Start Pi with the extension installed.
        2. Select a DirectSDK model.
        3. Send a non-sensitive example prompt.
        4. Observe the error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected area
      multiple: true
      options:
        - Installation or update
        - Authentication or Claude Code discovery
        - Model catalog or selection
        - Responses or streaming
        - Tools or conversation replay
        - Cache usage or performance
        - Other or unsure
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - npm package through pi install
        - Git repository through pi install
        - Local checkout
        - Other or not installed yet
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      placeholder: macOS 15 arm64, Ubuntu 24.04 x86_64, or Windows 11 with WSL
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: DirectSDK version or commit
      description: Include the installed version or Git commit, if known. Use pi list to identify your installation source.
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      description: Output of pi --version, if installed.
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of claude --version, if installed.
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of node --version, if used. Say bundled runtime if you use compiled Pi.
  - type: textarea
    id: logs
    attributes:
      label: Relevant error output or logs (optional)
      description: Paste only the relevant excerpt after removing credentials, tokens, private prompts, file paths, and conversation content.
      render: shell
  - type: textarea
    id: investigation
    attributes:
      label: Workaround or investigation (optional)
      description: Share anything you tried or a possible cause. A code investigation is not required.
