name: Feature request
description: Suggest an improvement to the DirectSDK extension.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/joaomj/pi-claude-directsdk/issues) and check the [troubleshooting guide](https://github.com/joaomj/pi-claude-directsdk/blob/main/docs/troubleshooting.md) first.
        Do not share credentials, tokens, private prompts, or unredacted conversation traces.
        Report security vulnerabilities through [private reporting](https://github.com/joaomj/pi-claude-directsdk/security/advisories/new), not here.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what prevents it today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. Implementation details are optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds considered
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Installation or configuration
        - Model selection or compatibility
        - Conversation or tools
        - Performance or reliability
        - Documentation or diagnostics
        - Other
