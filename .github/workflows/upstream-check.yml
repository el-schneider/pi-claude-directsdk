name: Upstream check

# Fails when joaomj/pi-claude-directsdk has commits this fork lacks.
# GitHub sends a failure notification; run scripts/sync-upstream.sh locally.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with upstream main
        run: |
          git fetch -q https://github.com/joaomj/pi-claude-directsdk.git main
          missing=$(git log --oneline HEAD..FETCH_HEAD)
          if [ -n "$missing" ]; then
            echo "Upstream commits missing from this fork:"
            echo "$missing"
            echo "Run scripts/sync-upstream.sh."
            exit 1
          fi
