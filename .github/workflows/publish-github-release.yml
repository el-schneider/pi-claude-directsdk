name: Publish available GitHub releases

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-available-github-releases
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Publish drafts whose npm version is available
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          function run(command, args) {
            return execFileSync(command, args, {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'pipe'],
              timeout: 30_000,
            });
          }

          const pages = JSON.parse(run('gh', [
            'api', `repos/${process.env.GH_REPO}/releases`, '--paginate', '--slurp',
          ]));
          for (const release of pages.flat()) {
            if (!release.draft || release.author.login !== 'github-actions[bot]') continue;
            const match = /^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/.exec(release.tag_name);
            if (!match) continue;
            const version = match[1];
            let publishedVersion;
            try {
              publishedVersion = JSON.parse(run('npm', [
                'view', `pi-claude-directsdk@${version}`, 'version', '--json',
                '--registry=https://registry.npmjs.org',
              ]));
            } catch (error) {
              if (error.status === 1 && error.stdout) {
                const response = JSON.parse(error.stdout);
                if (response.error?.code === 'E404') {
                  console.log(`${release.tag_name}: waiting for npm publication`);
                  continue;
                }
              }
              throw new Error(`Could not check npm availability for ${release.tag_name}`, { cause: error });
            }
            if (publishedVersion !== version) {
              throw new Error(`npm returned ${JSON.stringify(publishedVersion)} instead of ${version}`);
            }
            run('gh', ['release', 'edit', release.tag_name, '--draft=false']);
            console.log(`Published GitHub Release ${release.tag_name}`);
          }
          NODE
