# Release: tag-driven npm publish plus GitHub Release.
#
# Pushing a `v*` tag verifies the build, stages the package on npm
# through OIDC trusted publishing (no long-lived token), and creates a
# draft GitHub Release with generated notes. A maintainer approves the
# staged package with 2FA, verifies npm availability, then publishes the draft.
#
# One-time npm setup (package already exists on npmjs.com):
# npmjs.com -> pi-claude-directsdk -> Settings -> Trusted publishing ->
# GitHub Actions with organization/user `joaomj`, repository
# `pi-claude-directsdk`, and workflow filename `release.yml`.
# Staged publishing is always allowed; direct `npm publish` stays off.
# The workflow file must exist on main first.
# Requires npm CLI >= 11.5.1 and Node >= 22.14 in the publish job.
#
# CI checks types and compilation only. Runtime verification uses the
# maintainer’s installed Pi and stays outside CI. See docs/testing.md.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Refuse version mismatch
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version"; exit 1; }
      - run: npm ci
      - name: Report dependency vulnerabilities
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Create the draft GitHub Release.
      id-token: write # Required for npm OIDC trusted publishing.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm stage publish
      - run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --draft
        env:
          GH_TOKEN: ${{ github.token }}
